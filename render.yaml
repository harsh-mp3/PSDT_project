services:
  - type: web
    name: coal-mine-governance-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: DATABASE_URL
        fromDatabase:
          name: coal-mine-governance-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://save-baldev-the-destroyer2.vercel.app,http://localhost:5173,http://127.0.0.1:5173

databases:
  - name: coal-mine-governance-db
    plan: free
    databaseName: coal_mine_governance
    user: coal_mine_governance
